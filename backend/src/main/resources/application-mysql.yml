# ============ 生产环境（MySQL 8.x） ============
# 启动方式: java -jar exam-scan.jar --spring.profiles.active=mysql
# 首次使用请先执行 db/schema-mysql.sql 建库建表
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/exam_scan?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  sql:
    init:
      mode: never
